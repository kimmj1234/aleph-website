<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALEPH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 사이트 색상: 화이트 60% + 딥 틸(#004651) 30% + 연두(#A9B249) 포인트 10% */
      --white: #ffffff;
      --main: #004651;        /* 메인: 버튼·강조 면·글씨 모두 가능 (흰색과 대비 10.5:1, 위에 올리는 글씨는 화이트) */
      --main-light: #e6eeef;  /* 연한 메인 배경 */
      --accent: #A9B249;      /* 포인트: 면·밑줄·배지 전용. 흰색과 대비 2.29:1이라 글씨로 쓰지 않음, 위에 올리는 글씨는 메인(4.59:1) 또는 블랙 */
      --accent-text: #757B33; /* 흰 바탕 위에 연두 글씨가 꼭 필요할 때 (대비 4.5:1) */
      --black: #111111;       /* 포인트 */

      --navy: #03191b;        /* 인트로 전용 어두운 바탕 (배경 사진이 뜨기 전) */
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.6);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--navy); }
    body { font-family: "Noto Sans KR", "Helvetica Neue", Arial, sans-serif; color: var(--text); }

    #intro { position: fixed; inset: 0; cursor: pointer; overflow: hidden; }

    /* 배경: 서버룸 사진을 크게 블러 + 천천히 줌아웃 */
    .bg {
      position: absolute; inset: -60px;
      /* 임시 배경: 클로버 들판 (힉스필드로 생성한 이미지가 생기면 교체) */
      background: url("assets/bg-clover.webp") center 45% / cover no-repeat;
      filter: blur(5px) brightness(0.72) saturate(1.1);
      opacity: 0; transform: scale(1.12);
    }
    #intro.playing .bg { animation: fadeIn 2s ease forwards, drift 16s ease-out forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes drift { to { transform: scale(1); } }

    /* 가장자리를 어둡게 눌러 시선을 가운데로 */
    .veil {
      position: absolute; inset: 0; pointer-events: none;
      /* 밝은 들판 위에서도 흰 글씨가 읽히도록 메인 색(#004651) 톤으로 살짝 눌러줌 */
      background:
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0, 40, 46, 0.25), rgba(0, 30, 35, 0.75)),
        rgba(0, 70, 81, 0.15);
    }

    .stage {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center;
    }

    /* ALEPH: 넓게 흩어진 글자가 흐림에서 또렷해지며 모여듦 */
    .aleph {
      font-size: clamp(44px, 9vw, 120px); font-weight: 200; line-height: 1;
      letter-spacing: 0.9em; margin-right: -0.9em; /* 마지막 글자 뒤 자간 보정 */
      white-space: nowrap;
      opacity: 0; filter: blur(14px);
      transition: letter-spacing 2.6s var(--ease), margin-right 2.6s var(--ease),
                  opacity 1.6s ease, filter 2s var(--ease);
    }
    #intro.title-in .aleph {
      letter-spacing: 0.42em; margin-right: -0.42em;
      opacity: 1; filter: blur(0);
      text-shadow: 0 0 30px rgba(0, 30, 35, 0.6), 0 0 60px rgba(255, 255, 255, 0.15);
    }

    /* 가운데에서 양옆으로 펼쳐지는 가는 빛줄기 */
    .line {
      margin-top: clamp(22px, 3.2vw, 40px);
      width: clamp(120px, 22vw, 280px); height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
      transform: scaleX(0);
      transition: transform 1.6s var(--ease);
    }
    #intro.line-in .line { transform: scaleX(1); }

    .academy {
      margin-top: clamp(16px, 2.2vw, 26px);
      font-size: clamp(12px, 1.3vw, 16px); font-weight: 300; letter-spacing: 0.32em;
      margin-right: -0.32em;
      color: var(--text-dim); white-space: nowrap;
      opacity: 0; transform: translateY(8px);
      transition: opacity 1.4s ease, transform 1.4s var(--ease);
    }
    #intro.sub-in .academy { opacity: 1; transform: none; }

    .hint {
      position: absolute; bottom: 24px; left: 0; right: 0; text-align: center;
      font-size: 10px; color: rgba(255, 255, 255, 0.32); letter-spacing: .3em;
      opacity: 0; transition: opacity 1s ease;
    }
    #intro.done .hint { opacity: 1; }

    /* 클릭하면 인트로가 사라지고 메인 홈페이지(현재 백지)가 드러남 */
    /* 배경 사진이 뜨기 전에 뒤의 흰 메인 화면이 비쳐 빛나 보이지 않도록 어두운 바탕을 깔아둠 */
    #intro { z-index: 1; background: var(--navy); transition: opacity 1s ease, visibility 0s linear 1s; }
    #intro.leaving { opacity: 0; visibility: hidden; pointer-events: none; }
    #main { position: fixed; inset: 0; background: var(--white); color: var(--black); overflow: auto; }

    /* 영역 1개 = 한 화면. 스크롤하면 한 화면씩 딱 맞춰 넘어감 (점선은 작업용 가이드) */
    #main { scroll-snap-type: y mandatory; }
    .area {
      height: 100vh; height: 100dvh; box-sizing: border-box;
      scroll-snap-align: start;
      outline: 2px dashed rgba(17, 17, 17, 0.35); outline-offset: -12px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: rgba(17, 17, 17, 0.45); letter-spacing: 0.1em;
    }

    @media (prefers-reduced-motion: reduce) {
      .bg, .aleph, .line, .academy { transition: none !important; animation: none !important; }
      .bg { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="intro">
    <div class="bg"></div>
    <div class="veil"></div>

    <div class="stage">
      <div class="aleph">ALEPH</div>
      <div class="line"></div>
      <div class="academy">코리아 AI 아카데미 학원</div>
    </div>

    <div class="hint">CLICK OR SCROLL</div>
  </div>

  <!-- 메인 홈페이지 -->
  <main id="main">
    <section class="area" id="area1">영역 1</section>
    <section class="area" id="area2">영역 2</section>
    <section class="area" id="area3">영역 3</section>
  </main>

  <script>
    const intro = document.getElementById('intro');
    const STEPS = [
      ['title-in', 500],
      ['line-in', 2000],
      ['sub-in', 2600],
      ['done', 4600],
    ];

    let timers = [];
    function play() {
      timers.forEach(clearTimeout); timers = [];
      intro.classList.remove('leaving', 'playing', ...STEPS.map(([c]) => c));
      void intro.offsetWidth; // 클래스 초기화를 확실히 반영 → 처음부터 다시 재생
      intro.classList.add('playing');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      STEPS.forEach(([cls, at]) =>
        timers.push(setTimeout(() => intro.classList.add(cls), reduce ? 0 : at)));
    }

    // 클릭하거나 스크롤을 내리면 (애니메이션 도중이어도) 메인 홈페이지로 넘어감
    function enter() {
      if (intro.classList.contains('leaving')) return;
      timers.forEach(clearTimeout); timers = [];
      intro.classList.add('leaving');
    }
    intro.addEventListener('click', enter);
    // 마우스 휠·트랙패드로 아래로 스크롤
    intro.addEventListener('wheel', e => { if (e.deltaY > 0) enter(); }, { passive: true });
    // 터치: 손가락을 위로 쓸어올림 = 아래로 스크롤
    let touchY = null;
    intro.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
    intro.addEventListener('touchmove', e => {
      if (touchY !== null && touchY - e.touches[0].clientY > 30) { touchY = null; enter(); }
    }, { passive: true });
    // 키보드로 아래로 스크롤 (↓, PageDown, Space)
    addEventListener('keydown', e => {
      if (['ArrowDown', 'PageDown', ' '].includes(e.key)) enter();
    });

    // 최초 접속·새로고침 모두 매번 재생. 배경 이미지가 준비된 뒤 시작
    const ready = new Promise(res => {
      const i = new Image(); i.onload = i.onerror = res; i.src = 'assets/bg-clover.webp';
    });
    addEventListener('load', () => ready.then(() => setTimeout(play, 150)));
    // 뒤로가기로 캐시된 페이지가 복원될 때도 다시 재생
    addEventListener('pageshow', e => { if (e.persisted) play(); });
  </script>
</body>
</html>
