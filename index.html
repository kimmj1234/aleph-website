<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ALEPH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@200;300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      /* 사이트 색상: 화이트 60% + 딥 틸(#004651) 30% + 연두(#A9B249) 포인트 10% */
      --white: #ffffff;
      --main: #004651;        /* 메인: 버튼·강조 면·글씨 모두 가능 (흰색과 대비 10.5:1, 위에 올리는 글씨는 화이트) */
      --main-light: #e6eeef;  /* 연한 메인 배경 */
      --accent: #A9B249;      /* 포인트: 면·밑줄·배지 전용. 흰색과 대비 2.29:1이라 글씨로 쓰지 않음, 위에 올리는 글씨는 메인(4.59:1) 또는 블랙 */
      --accent-text: #757B33; /* 흰 바탕 위에 연두 글씨가 꼭 필요할 때 (대비 4.5:1) */
      --black: #111111;       /* 포인트 */

      --navy: #03191b;        /* 인트로 전용 어두운 바탕 (배경 사진이 뜨기 전) */
      --text: #ffffff;
      --text-dim: rgba(255, 255, 255, 0.6);
      --ease: cubic-bezier(.16, 1, .3, 1);
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--navy); }
    body { font-family: "Noto Sans KR", "Helvetica Neue", Arial, sans-serif; color: var(--text); }

    #intro { position: fixed; inset: 0; cursor: pointer; overflow: hidden; }

    /* 배경: 서버룸 사진을 크게 블러 + 천천히 줌아웃 */
    .bg {
      position: absolute; inset: -60px;
      /* 임시 배경: 클로버 들판 (힉스필드로 생성한 이미지가 생기면 교체) */
      background: url("assets/bg-clover.webp") center 45% / cover no-repeat;
      filter: blur(5px) brightness(0.72) saturate(1.1);
      opacity: 0; transform: scale(1.12);
    }
    #intro.playing .bg { animation: fadeIn 2s ease forwards, drift 16s ease-out forwards; }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes drift { to { transform: scale(1); } }

    /* 가장자리를 어둡게 눌러 시선을 가운데로 */
    .veil {
      position: absolute; inset: 0; pointer-events: none;
      /* 밝은 들판 위에서도 흰 글씨가 읽히도록 메인 색(#004651) 톤으로 살짝 눌러줌 */
      background:
        radial-gradient(ellipse 70% 60% at 50% 50%, rgba(0, 40, 46, 0.25), rgba(0, 30, 35, 0.75)),
        rgba(0, 70, 81, 0.15);
    }

    .stage {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center;
    }

    /* ALEPH: 넓게 흩어진 글자가 흐림에서 또렷해지며 모여듦 */
    .aleph {
      font-size: clamp(44px, 9vw, 120px); font-weight: 200; line-height: 1;
      letter-spacing: 0.9em; margin-right: -0.9em; /* 마지막 글자 뒤 자간 보정 */
      white-space: nowrap;
      opacity: 0; filter: blur(14px);
      transition: letter-spacing 2.6s var(--ease), margin-right 2.6s var(--ease),
                  opacity 1.6s ease, filter 2s var(--ease);
    }
    #intro.title-in .aleph {
      letter-spacing: 0.42em; margin-right: -0.42em;
      opacity: 1; filter: blur(0);
      text-shadow: 0 0 30px rgba(0, 30, 35, 0.6), 0 0 60px rgba(255, 255, 255, 0.15);
    }

    /* 가운데에서 양옆으로 펼쳐지는 가는 빛줄기 */
    .line {
      margin-top: clamp(22px, 3.2vw, 40px);
      width: clamp(120px, 22vw, 280px); height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
      transform: scaleX(0);
      transition: transform 1.6s var(--ease);
    }
    #intro.line-in .line { transform: scaleX(1); }

    .academy {
      margin-top: clamp(16px, 2.2vw, 26px);
      font-size: clamp(12px, 1.3vw, 16px); font-weight: 300; letter-spacing: 0.32em;
      margin-right: -0.32em;
      color: var(--text-dim); white-space: nowrap;
      opacity: 0; transform: translateY(8px);
      transition: opacity 1.4s ease, transform 1.4s var(--ease);
    }
    #intro.sub-in .academy { opacity: 1; transform: none; }

    .hint {
      position: absolute; bottom: 24px; left: 0; right: 0; text-align: center;
      font-size: 10px; color: rgba(255, 255, 255, 0.32); letter-spacing: .3em;
      opacity: 0; transition: opacity 1s ease;
    }
    #intro.done .hint { opacity: 1; }

    /* 클릭하면 인트로가 사라지고 메인 홈페이지(현재 백지)가 드러남 */
    /* 배경 사진이 뜨기 전에 뒤의 흰 메인 화면이 비쳐 빛나 보이지 않도록 어두운 바탕을 깔아둠 */
    #intro { z-index: 1; background: var(--navy); transition: opacity 1s ease, visibility 0s linear 1s; }
    #intro.leaving { opacity: 0; visibility: hidden; pointer-events: none; }
    #main { position: fixed; inset: 0; background: var(--white); color: var(--black); overflow: auto; }

    /* 영역 1개 = 한 화면. 스크롤하면 한 화면씩 딱 맞춰 넘어감 (점선은 작업용 가이드) */
    #main { scroll-snap-type: y mandatory; }
    .area {
      height: 100vh; height: 100dvh; box-sizing: border-box;
      scroll-snap-align: start;
      outline: 2px dashed rgba(17, 17, 17, 0.35); outline-offset: -12px; border-radius: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: rgba(17, 17, 17, 0.45); letter-spacing: 0.1em;
    }

    /* 유리 메뉴바가 비쳐 보이도록 메인 바탕에 옅은 색 번짐을 깔아둠 */
    #main {
      background:
        radial-gradient(42vw 42vw at 88% 0%, rgba(169, 178, 73, 0.34), transparent 70%),
        radial-gradient(45vw 45vw at 5% 8%, rgba(0, 70, 81, 0.18), transparent 70%),
        var(--white);
      background-attachment: local;
    }

    /* ── 최상단 메뉴바: iOS 메뉴 같은 짙은 반투명 유리 + 흰 글씨 ── */
    /* 유리 색: 뒤 배경이 살짝 비칠 정도(40%). 옅어진 만큼 글씨에 은은한 그림자를 줘서 읽기 쉽게 */
    .topbar, .menu-pop {
      --glass: rgba(20, 38, 42, 0.4);
      text-shadow: 0 1px 2px rgba(0, 20, 24, 0.35);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.10), rgba(255, 255, 255, 0) 60%), var(--glass);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 18px 40px -18px rgba(0, 30, 35, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(30px) saturate(1.8); -webkit-backdrop-filter: blur(30px) saturate(1.8);
      color: var(--white);
    }
    /* 흐림을 못 쓰는 브라우저에서는 불투명하게 */
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .topbar, .menu-pop { --glass: rgba(28, 48, 52, 0.96); }
    }
    .topbar {
      position: fixed; z-index: 10; top: 14px; left: 16px; right: 16px;
      max-width: 1200px; margin: 0 auto; box-sizing: border-box;
      height: 64px; padding: 0 10px 0 26px;
      display: flex; align-items: center; gap: 16px;
      border-radius: 999px;   /* 양 끝이 완전히 둥근 알약 모양 */
    }
    .brand {
      font-size: 18px; font-weight: 700; letter-spacing: 0.24em; color: var(--white); text-decoration: none;
    }

    .nav { display: flex; gap: 4px; margin: 0 auto; }
    .nav a {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 18px; border-radius: 999px;
      font-size: 15px; font-weight: 500; color: rgba(255, 255, 255, 0.92); text-decoration: none;
      transition: background .2s ease;
    }
    .nav svg { width: 18px; height: 18px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .nav a:hover { background: rgba(255, 255, 255, 0.12); }
    /* 지금 보고 있는 메뉴: 밝은 면 + 굵게 */
    .nav a[aria-current="page"] { color: var(--white); font-weight: 700; background: rgba(255, 255, 255, 0.22); }
    .nav a:focus-visible, .brand:focus-visible, .login-btn:focus-visible, .menu-btn:focus-visible { outline: 2px solid var(--white); outline-offset: 2px; }

    /* 로그인: 흰 면 + 딥 틸 글씨 (대비 10.5:1) */
    .login-btn {
      display: flex; align-items: center; gap: 8px;
      appearance: none; border: 0; cursor: pointer; font: inherit;
      padding: 11px 22px; border-radius: 999px;
      font-size: 15px; font-weight: 700; color: var(--main); background: var(--white);
      text-shadow: none; box-shadow: 0 6px 16px -8px rgba(0, 30, 35, 0.5);
      transition: transform .2s ease, filter .2s ease;
    }
    .login-btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .login-btn:hover { transform: translateY(-1px); filter: brightness(0.96); }

    /* 좁은 화면: 메뉴는 ☰ 버튼을 눌러 아래로 펼침 */
    .menu-btn {
      display: none; appearance: none; border: 0; cursor: pointer;
      width: 44px; height: 44px; border-radius: 50%; background: rgba(255, 255, 255, 0.14); color: var(--white);
    }
    /* 펼침 메뉴: 글자 왼쪽 · 아이콘 오른쪽, 항목 사이 가는 선 (참고 이미지의 iOS 메뉴 형태) */
    .menu-pop {
      position: fixed; inset: 84px 16px auto auto; margin: 0; width: min(280px, calc(100vw - 32px));
      padding: 6px 8px; box-sizing: border-box; border-radius: 26px;
    }
    .menu-pop .nav { flex-direction: column; gap: 0; margin: 0; }
    .menu-pop .nav a {
      flex-direction: row-reverse; justify-content: space-between;
      padding: 16px 14px; border-radius: 16px; font-size: 17px; font-weight: 400;
    }
    .menu-pop .nav a + a { box-shadow: 0 -1px 0 rgba(255, 255, 255, 0.16); }
    .menu-pop .nav a[aria-current="page"] { font-weight: 700; }
    .menu-pop .nav svg { width: 22px; height: 22px; }

    @media (max-width: 760px) {
      .topbar { top: 10px; left: 10px; right: 10px; height: 60px; padding: 0 8px 0 20px; gap: 8px; }
      .topbar > .nav { display: none; }
      .menu-btn { display: grid; place-items: center; margin-left: auto; }
      .login-btn { padding: 10px 16px; font-size: 14px; }
      .login-btn svg { display: none; }
    }
    /* 넓은 화면에선 펼침 메뉴를 아예 숨김 */
    @media (min-width: 761px) { .menu-pop { display: none !important; } }

    @media (prefers-reduced-motion: reduce) {
      .bg, .aleph, .line, .academy { transition: none !important; animation: none !important; }
      .bg { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="intro">
    <div class="bg"></div>
    <div class="veil"></div>

    <div class="stage">
      <div class="aleph">ALEPH</div>
      <div class="line"></div>
      <div class="academy">코리아 AI 아카데미 학원</div>
    </div>

    <div class="hint">CLICK OR SCROLL</div>
  </div>

  <!-- 메인 홈페이지 -->
  <main id="main">
    <header class="topbar">
      <a class="brand" href="#area1" aria-label="ALEPH 학생 홈">ALEPH</a>
      <nav class="nav" aria-label="주 메뉴">
        <a href="#area1" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>학생 홈</span></a>
        <a href="#learn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 5h6a4 4 0 0 1 4 4v11a3 3 0 0 0-3-3H2zM22 5h-6a4 4 0 0 0-4 4v11a3 3 0 0 1 3-3h7z"/></svg><span>학습 메뉴</span></a>
        <a href="#career"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M3 13h18"/></svg><span>취업 준비</span></a>
        <a href="#help"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17.5h.01"/></svg><span>도움말</span></a>
      </nav>
      <button class="menu-btn" type="button" popovertarget="menuPop" aria-label="메뉴 열기">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="login-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>로그인</button>
    </header>
    <div class="menu-pop" id="menuPop" popover>
      <nav class="nav" aria-label="주 메뉴 (모바일)"></nav>
    </div>

    <section class="area" id="area1">영역 1</section>
    <section class="area" id="area2">영역 2</section>
    <section class="area" id="area3">영역 3</section>
  </main>

  <script>
    const intro = document.getElementById('intro');
    const STEPS = [
      ['title-in', 500],
      ['line-in', 2000],
      ['sub-in', 2600],
      ['done', 4600],
    ];

    let timers = [];
    function play() {
      timers.forEach(clearTimeout); timers = [];
      intro.classList.remove('leaving', 'playing', ...STEPS.map(([c]) => c));
      void intro.offsetWidth; // 클래스 초기화를 확실히 반영 → 처음부터 다시 재생
      intro.classList.add('playing');
      const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
      STEPS.forEach(([cls, at]) =>
        timers.push(setTimeout(() => intro.classList.add(cls), reduce ? 0 : at)));
    }

    // 클릭하거나 스크롤을 내리면 (애니메이션 도중이어도) 메인 홈페이지로 넘어감
    function enter() {
      if (intro.classList.contains('leaving')) return;
      timers.forEach(clearTimeout); timers = [];
      intro.classList.add('leaving');
    }
    intro.addEventListener('click', enter);
    // 마우스 휠·트랙패드로 아래로 스크롤
    intro.addEventListener('wheel', e => { if (e.deltaY > 0) enter(); }, { passive: true });
    // 터치: 손가락을 위로 쓸어올림 = 아래로 스크롤
    let touchY = null;
    intro.addEventListener('touchstart', e => { touchY = e.touches[0].clientY; }, { passive: true });
    intro.addEventListener('touchmove', e => {
      if (touchY !== null && touchY - e.touches[0].clientY > 30) { touchY = null; enter(); }
    }, { passive: true });
    // 키보드로 아래로 스크롤 (↓, PageDown, Space)
    addEventListener('keydown', e => {
      if (['ArrowDown', 'PageDown', ' '].includes(e.key)) enter();
    });

    // 메뉴바: 모바일 펼침 메뉴는 위 메뉴를 그대로 복사해서 씀 (메뉴 목록은 한 곳에서만 관리)
    const menuPop = document.getElementById('menuPop');
    menuPop.querySelector('.nav').innerHTML = document.querySelector('.topbar > .nav').innerHTML;
    const navLinks = document.querySelectorAll('.nav a');
    navLinks.forEach(a => a.addEventListener('click', () => {
      // 누른 메뉴를 '지금 보는 메뉴'로 표시 (위·모바일 메뉴 둘 다)
      navLinks.forEach(x => x.getAttribute('href') === a.getAttribute('href')
        ? x.setAttribute('aria-current', 'page') : x.removeAttribute('aria-current'));
      if (menuPop.hidePopover && menuPop.matches(':popover-open')) menuPop.hidePopover();
    }));
    // ponytail: popover 미지원(구형) 브라우저는 펼침 메뉴를 단순 표시/숨김으로 대체
    if (!('popover' in HTMLElement.prototype)) {
      menuPop.hidden = true;
      document.querySelector('.menu-btn').addEventListener('click', () => { menuPop.hidden = !menuPop.hidden; });
    }

    // 최초 접속·새로고침 모두 매번 재생. 배경 이미지가 준비된 뒤 시작
    const ready = new Promise(res => {
      const i = new Image(); i.onload = i.onerror = res; i.src = 'assets/bg-clover.webp';
    });
    addEventListener('load', () => ready.then(() => setTimeout(play, 150)));
    // 뒤로가기로 캐시된 페이지가 복원될 때도 다시 재생
    addEventListener('pageshow', e => { if (e.persisted) play(); });
  </script>
</body>
</html>
